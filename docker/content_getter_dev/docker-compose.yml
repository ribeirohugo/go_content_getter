services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ../../:/app
      - ./config.toml:/app/config.toml
    ports:
      - "8080:8080"
    command: go run ./cmd/server

  frontend:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ../../frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run start -- --host 0.0.0.0"
    environment:
      - VITE_API_URL=http://localhost:8080/api
    depends_on:
      - backend
